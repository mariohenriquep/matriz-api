# Análise de qualidade no SonarQube Cloud (Ficha 05, Ex. 4). Corre no job "qualidade" da CI.
# A organização e a chave são as que o SonarQube Cloud criou ao importar o repositório do GitHub.
# O SonarQube Cloud analisa o repositório inteiro; aqui só se diz o que fica de fora.
sonar.organization=mariohenriquep
sonar.projectKey=mariohenriquep_matriz-api
sonar.projectName=Matriz

sonar.exclusions=**/node_modules/**,**/target/**,frontend/dist/**,frontend/coverage/**,e2e/playwright-report/**,e2e/test-results/**
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.java.source=21
# Cobertura (Ex. 6): relatórios gerados no job "qualidade" pelo JaCoCo (./mvnw verify) e pelo Vitest (npm run test:cobertura)
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
# Fora da cobertura: os próprios testes, o E2E, os scripts de verificação e a configuração das ferramentas
sonar.coverage.exclusions=backend/src/test/**,**/*.test.ts,**/*.test.tsx,frontend/src/testes/**,frontend/src/main.tsx,e2e/**,scripts/**,**/*.config.ts
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
