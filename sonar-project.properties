# Análise de qualidade no SonarQube Cloud (Ficha 05, Ex. 4). Corre no job "qualidade" da CI.
# A organização e a chave são as que o SonarQube Cloud cria ao importar o repositório do GitHub.
sonar.organization=mariohenriquep
sonar.projectKey=mariohenriquep_matriz-api
sonar.projectName=Matriz

sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/testes/**
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/testes/**
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.java.source=21
sonar.sourceEncoding=UTF-8
