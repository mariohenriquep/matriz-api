openapi: 3.1.0
info:
  title: Matriz API
  version: 0.1.0
  summary: Contrato REST simplificado do MVP da Matriz (Ficha 02, Exercício 3).
  description: |
    Operações documentadas nesta versão:

    - `GET /projetos/{projetoId}/tarefas` — listar e filtrar tarefas (US-10, RF-12).
    - `POST /projetos/{projetoId}/tarefas` — criar tarefa (US-06, RF-08).
    - `PATCH /tarefas/{tarefaId}/estado` — alterar o estado de uma tarefa (US-09, RF-11; usada também pelo Kanban, US-13).

    Os nomes seguem o modelo de dados em `docs/database.md`. Os erros usam *Problem Details*
    (RFC 9457) com mensagens em português, como em `docs/architecture.md` §5.

    **Endpoints previstos para a Aula 03** (ainda sem schemas), um grupo por módulo de
    `docs/architecture.md` §4:

    - Identidade e acesso: `POST /auth/registo`, `POST /auth/login`, `POST /auth/logout`.
    - Projetos e membros: `GET|POST /projetos`, `GET|PATCH /projetos/{id}`,
      `POST /projetos/{id}/arquivo`, `DELETE /projetos/{id}/arquivo` (reativar),
      `GET|POST /projetos/{id}/membros`, `DELETE /projetos/{id}/membros/{utilizadorId}`.
    - Tarefas: `PATCH|DELETE /tarefas/{id}`, `GET /eu/tarefas` (As minhas tarefas).
    - Progresso: calculado a partir de `GET /projetos/{id}/tarefas` ou num endpoint próprio, a decidir.
    - Notificações: `GET /eu/notificacoes`, `GET /eu/notificacoes/nao-lidas/contagem`,
      `POST /eu/notificacoes/{id}/lida`.
    - Administração: `POST|DELETE /admin/administradores/{utilizadorId}`, `GET /admin/registo`.

    O mecanismo de autenticação ainda não foi decidido (D-05). Aqui é representado como um
    token *bearer*; pode vir a ser uma sessão com cookie sem mudar as operações.
servers:
  - url: http://localhost:8080/api/v1
    description: Ambiente local (exemplo; porta e prefixo por decidir com a stack)
security:
  - bearerAuth: []
tags:
  - name: Tarefas
    description: Gestão de tarefas de um projeto.

paths:
  /projetos/{projetoId}/tarefas:
    parameters:
      - $ref: '#/components/parameters/ProjetoId'
    get:
      tags: [Tarefas]
      operationId: listarTarefas
      summary: Listar as tarefas de um projeto
      description: |
        Devolve as tarefas do projeto, com filtros opcionais que se combinam (E lógico).
        Disponível para membros do projeto e administradores globais. Também funciona em
        projetos arquivados (só leitura).
      parameters:
        - name: estado
          in: query
          required: false
          description: Filtrar por estado.
          schema:
            $ref: '#/components/schemas/EstadoTarefa'
        - name: responsavelId
          in: query
          required: false
          description: Filtrar por responsável.
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: Lista de tarefas (pode estar vazia, US-10 crit. 3).
          content:
            application/json:
              schema:
                type: object
                required: [itens, total]
                properties:
                  itens:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tarefa'
                  total:
                    type: integer
                    minimum: 0
              examples:
                porFazer:
                  summary: Filtro estado=POR_FAZER
                  value:
                    total: 1
                    itens:
                      - id: '101'
                        projetoId: '7'
                        titulo: Rever logótipo
                        descricao: null
                        estado: POR_FAZER
                        prioridade: MEDIA
                        responsavel: null
                        criador: { id: '3', nome: Rui }
                        dataLimite: null
                        atrasada: false
                        criadoEm: '2026-11-02T10:00:00Z'
                        atualizadoEm: '2026-11-02T10:00:00Z'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

    post:
      tags: [Tarefas]
      operationId: criarTarefa
      summary: Criar uma tarefa
      description: |
        Cria uma tarefa no projeto, com estado `POR_FAZER`. O utilizador autenticado fica como
        criador. Só para membros do projeto (ou administradores). Se for indicado um
        responsável diferente do criador, este recebe uma notificação (RF-16).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovaTarefa'
            examples:
              minima:
                summary: Só o título (US-06 crit. 1)
                value:
                  titulo: Rever logótipo
              completa:
                summary: Todos os campos (US-06 crit. 2)
                value:
                  titulo: Rever logótipo
                  descricao: Ajustar cores à nova paleta.
                  prioridade: ALTA
                  responsavelId: '5'
                  dataLimite: '2026-11-15'
      responses:
        '201':
          description: Tarefa criada.
          headers:
            Location:
              description: URL da tarefa criada.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarefa'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/ProjetoArquivado'
        '422':
          $ref: '#/components/responses/RegraDeNegocio'

  /tarefas/{tarefaId}/estado:
    parameters:
      - $ref: '#/components/parameters/TarefaId'
    patch:
      tags: [Tarefas]
      operationId: alterarEstadoTarefa
      summary: Alterar o estado de uma tarefa
      description: |
        Muda o estado da tarefa. Qualquer transição entre os três estados é permitida (P-04).
        Se o estado pedido for igual ao atual, nada muda e não há notificação (CE-10).
        Se a tarefa tiver responsável e este não for quem faz o pedido, o responsável é
        notificado (US-09 crit. 4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              additionalProperties: false
              properties:
                estado:
                  $ref: '#/components/schemas/EstadoTarefa'
            examples:
              emCurso:
                value:
                  estado: EM_CURSO
      responses:
        '200':
          description: Estado atualizado (ou já era esse).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarefa'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/ProjetoArquivado'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Provisório; mecanismo final em D-05.

  parameters:
    ProjetoId:
      name: projetoId
      in: path
      required: true
      description: Identificador do projeto.
      schema:
        $ref: '#/components/schemas/Id'
    TarefaId:
      name: tarefaId
      in: path
      required: true
      description: Identificador da tarefa.
      schema:
        $ref: '#/components/schemas/Id'

  schemas:
    Id:
      type: string
      description: Identificador opaco (tipo concreto por decidir, `docs/database.md` §5).
      examples: ['42']

    EstadoTarefa:
      type: string
      enum: [POR_FAZER, EM_CURSO, CONCLUIDA]

    Prioridade:
      type: string
      enum: [BAIXA, MEDIA, ALTA]
      default: MEDIA

    UtilizadorResumo:
      type: object
      required: [id, nome]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nome:
          type: string

    NovaTarefa:
      type: object
      required: [titulo]
      additionalProperties: false
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '\S'
          description: Obrigatório; não pode ser só espaços (P-24).
        descricao:
          type: [string, 'null']
        prioridade:
          $ref: '#/components/schemas/Prioridade'
        responsavelId:
          description: Tem de ser membro do projeto (RN-02).
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        dataLimite:
          type: [string, 'null']
          format: date
          description: Pode estar no passado (CE-06).

    Tarefa:
      type: object
      required: [id, projetoId, titulo, estado, prioridade, criador, atrasada, criadoEm, atualizadoEm]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        projetoId:
          $ref: '#/components/schemas/Id'
        titulo:
          type: string
        descricao:
          type: [string, 'null']
        estado:
          $ref: '#/components/schemas/EstadoTarefa'
        prioridade:
          $ref: '#/components/schemas/Prioridade'
        responsavel:
          oneOf:
            - $ref: '#/components/schemas/UtilizadorResumo'
            - type: 'null'
        criador:
          $ref: '#/components/schemas/UtilizadorResumo'
        dataLimite:
          type: [string, 'null']
          format: date
        atrasada:
          type: boolean
          description: Calculado; verdadeiro se dataLimite já passou e estado ≠ CONCLUIDA (P-27).
        criadoEm:
          type: string
          format: date-time
        atualizadoEm:
          type: string
          format: date-time

    Problema:
      type: object
      description: Erro no formato Problem Details (RFC 9457).
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: Mensagem em português para mostrar ao utilizador.
        erros:
          type: array
          description: Erros de validação por campo.
          items:
            type: object
            required: [campo, mensagem]
            properties:
              campo:
                type: string
              mensagem:
                type: string

  responses:
    PedidoInvalido:
      description: 'Dados inválidos (ex.: título vazio, estado inexistente).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            tituloEmFalta:
              summary: US-06 crit. 3
              value:
                type: /erros/validacao
                title: Pedido inválido
                status: 400
                detail: O título é obrigatório
                erros:
                  - campo: titulo
                    mensagem: O título é obrigatório
            estadoInexistente:
              summary: US-09 crit. 3
              value:
                type: /erros/validacao
                title: Pedido inválido
                status: 400
                detail: Estado inválido
                erros:
                  - campo: estado
                    mensagem: Use POR_FAZER, EM_CURSO ou CONCLUIDA
    NaoAutenticado:
      description: Sem sessão válida (RNF-02).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    NaoEncontrado:
      description: |
        O recurso não existe **ou** o utilizador não tem acesso a ele. As duas situações dão
        a mesma resposta para não revelar que o projeto existe (CE-07).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: /erros/nao-encontrado
            title: Não encontrado
            status: 404
            detail: Projeto não encontrado
    ProjetoArquivado:
      description: O projeto está arquivado e só aceita leitura (RN-04, US-16 crit. 2).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: /erros/projeto-arquivado
            title: Projeto arquivado
            status: 409
            detail: O projeto está arquivado
    RegraDeNegocio:
      description: Pedido bem formado, mas viola uma regra de negócio.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: /erros/responsavel-nao-membro
            title: Regra de negócio
            status: 422
            detail: O responsável tem de ser membro do projeto
