openapi: 3.1.0
info:
  title: Matriz API
  version: 0.2.0
  summary: Contrato REST do MVP da Matriz (Ficha 03).
  description: |
    Contrato completo para o âmbito da Ficha 03: autenticação, projetos e membros, tarefas,
    responsáveis e comentários. Os nomes seguem `docs/database.md`; as regras de acesso estão em
    `docs/implementation-plan.md` §3.

    **Autenticação (D-05):** `POST /auth/login` devolve um token JWT que o cliente envia em
    `Authorization: Bearer <token>`. O token expira 8 horas depois de emitido (P-28).
    `POST /auth/logout` invalida todos os tokens já emitidos para o utilizador (o servidor guarda
    uma versão de token por utilizador e incrementa-a).

    **Erros:** formato *Problem Details* (RFC 9457) com mensagens em português.

    | Código | Significado nesta API |
    |--------|-----------------------|
    | 400 | Dados inválidos (validação). |
    | 401 | Sem token, token inválido ou expirado. |
    | 403 | É membro do projeto, mas não tem o papel necessário (ex.: só o Gestor edita o projeto). |
    | 404 | O recurso não existe **ou** o utilizador não é membro do projeto (não se revela a existência, CE-07). |
    | 409 | Conflito com o estado atual (ex.: responsável já atribuído, utilizador já é membro). |
    | 422 | Pedido bem formado que viola uma regra de negócio (ex.: responsável não é membro). |

    **Paginação:** não existe no MVP (P-01, RNF-08). As listas vêm em `{ itens, total }`, para se
    poder acrescentar paginação sem quebrar o contrato.

    **Alterações face à versão 0.1.0 (Ficha 02):** vários responsáveis por tarefa (`responsaveis`
    em vez de `responsavel`); filtro por prioridade; comentários; eliminação de projetos;
    pesquisa de projetos; `PATCH /tarefas/{id}/estado` substituído por `PATCH /tarefas/{id}`.
servers:
  - url: http://localhost:8080/api/v1
    description: Backend local (porta por defeito do Spring Boot).
security:
  - bearerAuth: []
tags:
  - name: Autenticação
  - name: Projetos
  - name: Membros
  - name: Tarefas
  - name: Responsáveis
  - name: Comentários

paths:
  /auth/login:
    post:
      tags: [Autenticação]
      operationId: iniciarSessao
      summary: Iniciar sessão
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
            example:
              email: ana@matriz.local
              password: demo1234
      responses:
        '200':
          description: Sessão iniciada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessao'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          description: 'Credenciais inválidas (mensagem genérica, US-01 crit. 4).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              example:
                type: /erros/credenciais-invalidas
                title: Não autenticado
                status: 401
                detail: Credenciais inválidas

  /auth/eu:
    get:
      tags: [Autenticação]
      operationId: obterUtilizadorAutenticado
      summary: Consultar o utilizador autenticado
      responses:
        '200':
          description: Utilizador associado ao token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilizador'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /auth/logout:
    post:
      tags: [Autenticação]
      operationId: terminarSessao
      summary: Terminar sessão
      description: Invalida todos os tokens emitidos até agora para este utilizador.
      responses:
        '204':
          description: Sessão terminada.
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /projetos:
    get:
      tags: [Projetos]
      operationId: listarProjetos
      summary: Listar os projetos acessíveis
      description: |
        Devolve os projetos de que o utilizador é membro, com as contagens de tarefas por estado
        (usadas no painel inicial). Ordenados por nome.
      parameters:
        - name: pesquisa
          in: query
          required: false
          description: Filtra pelos projetos cujo nome contém este texto (sem distinguir maiúsculas nem acentos).
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Lista (pode estar vazia).
          content:
            application/json:
              schema:
                type: object
                required: [itens, total]
                properties:
                  itens:
                    type: array
                    items:
                      $ref: '#/components/schemas/Projeto'
                  total:
                    type: integer
                    minimum: 0
        '401':
          $ref: '#/components/responses/NaoAutenticado'
    post:
      tags: [Projetos]
      operationId: criarProjeto
      summary: Criar projeto
      description: O utilizador autenticado fica como Gestor e membro do projeto (o cliente não indica o dono).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjetoDados'
            example:
              nome: Website 2027
              descricao: Novo site institucional.
      responses:
        '201':
          description: Projeto criado.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Projeto'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /projetos/{projetoId}:
    parameters:
      - $ref: '#/components/parameters/ProjetoId'
    get:
      tags: [Projetos]
      operationId: obterProjeto
      summary: Consultar projeto
      responses:
        '200':
          description: Projeto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Projeto'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    patch:
      tags: [Projetos]
      operationId: editarProjeto
      summary: Editar projeto (só Gestor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjetoAlteracao'
      responses:
        '200':
          description: Projeto atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Projeto'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    delete:
      tags: [Projetos]
      operationId: eliminarProjeto
      summary: Eliminar projeto (só Gestor)
      description: |
        Elimina o projeto e, na mesma transação, as suas tarefas, atribuições, comentários e
        membros (RN-10). A interface pede confirmação antes de chamar esta operação.
      responses:
        '204':
          description: Projeto eliminado.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /projetos/{projetoId}/membros:
    parameters:
      - $ref: '#/components/parameters/ProjetoId'
    get:
      tags: [Membros]
      operationId: listarMembros
      summary: Listar membros (utilizadores elegíveis como responsáveis)
      responses:
        '200':
          description: Membros do projeto, incluindo o Gestor.
          content:
            application/json:
              schema:
                type: object
                required: [itens, total]
                properties:
                  itens:
                    type: array
                    items:
                      $ref: '#/components/schemas/Membro'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    post:
      tags: [Membros]
      operationId: adicionarMembro
      summary: Adicionar membro por email (só Gestor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
      responses:
        '201':
          description: Membro adicionado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membro'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraDeNegocio'

  /projetos/{projetoId}/membros/{utilizadorId}:
    parameters:
      - $ref: '#/components/parameters/ProjetoId'
      - $ref: '#/components/parameters/UtilizadorId'
    delete:
      tags: [Membros]
      operationId: removerMembro
      summary: Remover membro (só Gestor)
      description: As atribuições desse membro nas tarefas do projeto são removidas (RN-03). O Gestor não pode ser removido.
      responses:
        '204':
          description: Membro removido.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'

  /projetos/{projetoId}/tarefas:
    parameters:
      - $ref: '#/components/parameters/ProjetoId'
    get:
      tags: [Tarefas]
      operationId: listarTarefas
      summary: Listar e filtrar tarefas
      description: Os filtros combinam-se (E lógico). Ordenadas da mais recente para a mais antiga.
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EstadoTarefa'
        - name: prioridade
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Prioridade'
        - name: responsavelId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: Lista (pode estar vazia).
          content:
            application/json:
              schema:
                type: object
                required: [itens, total]
                properties:
                  itens:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tarefa'
                  total:
                    type: integer
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    post:
      tags: [Tarefas]
      operationId: criarTarefa
      summary: Criar tarefa
      description: Estado inicial `POR_FAZER`. O criador é o utilizador autenticado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovaTarefa'
            example:
              titulo: Rever logótipo
              prioridade: ALTA
              responsavelIds: ['5']
              dataLimite: '2026-11-15'
      responses:
        '201':
          description: Tarefa criada.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarefa'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraDeNegocio'

  /tarefas/{tarefaId}:
    parameters:
      - $ref: '#/components/parameters/TarefaId'
    get:
      tags: [Tarefas]
      operationId: obterTarefa
      summary: Consultar tarefa
      responses:
        '200':
          description: Tarefa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarefa'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    patch:
      tags: [Tarefas]
      operationId: editarTarefa
      summary: Editar tarefa (incluindo estado e prioridade)
      description: Só os campos enviados são alterados. Qualquer transição de estado é permitida (P-04).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TarefaAlteracao'
            example:
              estado: EM_CURSO
      responses:
        '200':
          description: Tarefa atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarefa'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    delete:
      tags: [Tarefas]
      operationId: eliminarTarefa
      summary: Eliminar tarefa (criador ou Gestor)
      description: Elimina também as atribuições e os comentários da tarefa (RN-10).
      responses:
        '204':
          description: Tarefa eliminada.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /tarefas/{tarefaId}/responsaveis:
    parameters:
      - $ref: '#/components/parameters/TarefaId'
    post:
      tags: [Responsáveis]
      operationId: atribuirResponsavel
      summary: Atribuir um responsável
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [utilizadorId]
              additionalProperties: false
              properties:
                utilizadorId:
                  $ref: '#/components/schemas/Id'
      responses:
        '201':
          description: Atribuição criada; devolve a tarefa atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tarefa'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          $ref: '#/components/responses/RegraDeNegocio'

  /tarefas/{tarefaId}/responsaveis/{utilizadorId}:
    parameters:
      - $ref: '#/components/parameters/TarefaId'
      - $ref: '#/components/parameters/UtilizadorId'
    delete:
      tags: [Responsáveis]
      operationId: removerResponsavel
      summary: Remover uma atribuição
      responses:
        '204':
          description: Atribuição removida.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /tarefas/{tarefaId}/comentarios:
    parameters:
      - $ref: '#/components/parameters/TarefaId'
    get:
      tags: [Comentários]
      operationId: listarComentarios
      summary: Listar comentários
      description: Do mais antigo para o mais recente.
      responses:
        '200':
          description: Comentários (pode estar vazia).
          content:
            application/json:
              schema:
                type: object
                required: [itens, total]
                properties:
                  itens:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comentario'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    post:
      tags: [Comentários]
      operationId: adicionarComentario
      summary: Adicionar comentário
      description: O autor e a data são definidos pelo backend; o cliente só envia o conteúdo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conteudo]
              additionalProperties: false
              properties:
                conteudo:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  pattern: '\S'
            example:
              conteudo: Já enviei a primeira versão ao cliente.
      responses:
        '201':
          description: Comentário criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comentario'
        '400':
          $ref: '#/components/responses/PedidoInvalido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProjetoId:
      name: projetoId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    TarefaId:
      name: tarefaId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    UtilizadorId:
      name: utilizadorId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'

  schemas:
    Id:
      type: string
      description: Identificador numérico serializado como texto.
      pattern: '^[0-9]+$'
      examples: ['42']

    EstadoTarefa:
      type: string
      enum: [POR_FAZER, EM_CURSO, CONCLUIDA]

    Prioridade:
      type: string
      enum: [BAIXA, MEDIA, ALTA]

    Papel:
      type: string
      enum: [GESTOR, MEMBRO]

    Utilizador:
      type: object
      required: [id, nome, email]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nome:
          type: string
        email:
          type: string
          format: email

    UtilizadorResumo:
      type: object
      required: [id, nome]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nome:
          type: string

    Sessao:
      type: object
      required: [token, expiraEm, utilizador]
      properties:
        token:
          type: string
        expiraEm:
          type: string
          format: date-time
        utilizador:
          $ref: '#/components/schemas/Utilizador'

    ContagensPorEstado:
      type: object
      required: [POR_FAZER, EM_CURSO, CONCLUIDA, total]
      properties:
        POR_FAZER:
          type: integer
        EM_CURSO:
          type: integer
        CONCLUIDA:
          type: integer
        total:
          type: integer

    ProjetoDados:
      type: object
      required: [nome]
      additionalProperties: false
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '\S'
        descricao:
          type: [string, 'null']
          maxLength: 1000

    ProjetoAlteracao:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '\S'
        descricao:
          type: [string, 'null']
          maxLength: 1000

    Projeto:
      type: object
      required: [id, nome, gestor, meuPapel, contagens, criadoEm, atualizadoEm]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nome:
          type: string
        descricao:
          type: [string, 'null']
        gestor:
          $ref: '#/components/schemas/UtilizadorResumo'
        meuPapel:
          $ref: '#/components/schemas/Papel'
        contagens:
          $ref: '#/components/schemas/ContagensPorEstado'
        criadoEm:
          type: string
          format: date-time
        atualizadoEm:
          type: string
          format: date-time

    Membro:
      type: object
      required: [utilizador, papel]
      properties:
        utilizador:
          $ref: '#/components/schemas/Utilizador'
        papel:
          $ref: '#/components/schemas/Papel'

    NovaTarefa:
      type: object
      required: [titulo]
      additionalProperties: false
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '\S'
        descricao:
          type: [string, 'null']
          maxLength: 2000
        prioridade:
          $ref: '#/components/schemas/Prioridade'
        dataLimite:
          type: [string, 'null']
          format: date
        responsavelIds:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Id'

    TarefaAlteracao:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '\S'
        descricao:
          type: [string, 'null']
          maxLength: 2000
        estado:
          $ref: '#/components/schemas/EstadoTarefa'
        prioridade:
          $ref: '#/components/schemas/Prioridade'
        dataLimite:
          type: [string, 'null']
          format: date

    Tarefa:
      type: object
      required: [id, projetoId, titulo, estado, prioridade, responsaveis, criador, atrasada, criadoEm, atualizadoEm]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        projetoId:
          $ref: '#/components/schemas/Id'
        titulo:
          type: string
        descricao:
          type: [string, 'null']
        estado:
          $ref: '#/components/schemas/EstadoTarefa'
        prioridade:
          $ref: '#/components/schemas/Prioridade'
        responsaveis:
          type: array
          items:
            $ref: '#/components/schemas/UtilizadorResumo'
        criador:
          $ref: '#/components/schemas/UtilizadorResumo'
        dataLimite:
          type: [string, 'null']
          format: date
        atrasada:
          type: boolean
          description: 'Calculado: dataLimite já passou e estado diferente de CONCLUIDA (P-27).'
        totalComentarios:
          type: integer
        criadoEm:
          type: string
          format: date-time
        atualizadoEm:
          type: string
          format: date-time

    Comentario:
      type: object
      required: [id, conteudo, autor, criadoEm]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        conteudo:
          type: string
        autor:
          $ref: '#/components/schemas/UtilizadorResumo'
        criadoEm:
          type: string
          format: date-time

    Problema:
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        erros:
          type: array
          items:
            type: object
            required: [campo, mensagem]
            properties:
              campo:
                type: string
              mensagem:
                type: string

  responses:
    PedidoInvalido:
      description: 'Dados inválidos (ex.: título vazio ou só com espaços, estado inexistente).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
